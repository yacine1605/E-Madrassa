services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: madrassa
      POSTGRES_USER: school_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set a local development password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_owner -d madrassa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
