; Production settings of the platform's image.
expose_php = Off
memory_limit = 256M
; Imports up to 20 MB (FR-IMP-01); files within the schools' own limit (FR-FIC-01, 50 MB at most).
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 60
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
session.use_strict_mode = 1
